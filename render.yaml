databases:
  - name: diamante360-db
    databaseName: eldiamante360
    user: eldiamante360
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: diamante360-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: diamante360-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: diamante360-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: diamante360-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: diamante360-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: diamante360-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://gestionapp2026.github.io,http://localhost:5173
